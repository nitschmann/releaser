name: Update Documentation

on:
  workflow_run:
    workflows: ["Linter & Tests", "Build"]
    types: [completed]
    branches: [main]

jobs:
  update-docs:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Ensure we're on main branch
        run: |
          git checkout main
          git pull origin main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        run: go mod download

      - name: Generate documentation
        run: make docs

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Add and commit changes
          git add docs/
          git commit -m "docs: auto-update CLI documentation [skip ci]"

          # Try to push directly first
          if git push origin main; then
            echo "Successfully pushed changes"
          else
            echo "Push failed, trying to pull and rebase..."
            # If push fails, pull latest changes and rebase
            git pull --rebase origin main
            # Push again
            git push origin main
          fi
