name: Debug workflow_run
on:
  workflow_run:
    workflows: ["Linter & Tests"]
    types: [completed]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Event triggered!"
      - run: echo "${{ toJson(github.event) }}"
